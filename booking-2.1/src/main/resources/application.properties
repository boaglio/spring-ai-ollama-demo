spring.application.name=booking-2.1
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

# 2.x: the ".options" segment is gone (old keys are deprecated aliases)
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${CHAT_MODEL:qwen3:8b}
# 2.0: think-option -> think (true|false|low|medium|high)
spring.ai.ollama.chat.think=true
# 2.x: no temperature default any more, the model's own default applies

# 2.1: DecisionModel (default model d1-omni:600m)
spring.ai.ollama.decision.model=${DECISION_MODEL:d1-omni:600m}

# 2.1: tool call limits (defaults: 40 per tool, 150 per turn); lowered for the demo
spring.ai.tools.limits.max-calls-per-tool.searchFlights=3
